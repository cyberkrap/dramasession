name: Diagnose username effect source

on:
  push:
    branches:
      - agent/migrate-effect-assets

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-effect-assets
          fetch-depth: 0
      - name: Probe public rDrama fork trees
        shell: bash
        run: |
          set +e
          {
            echo "UTC: $(date -u +%FT%TZ)"
            while read -r repo branch; do
              slug="$(echo "$repo" | tr '/A-Z' '__a-z')"
              dir="/tmp/$slug"
              rm -rf "$dir"
              echo
              echo "=== $repo @ $branch ==="
              git clone --depth 1 --filter=blob:none --no-checkout --branch "$branch" "https://github.com/$repo.git" "$dir" 2>&1
              status=$?
              echo "clone_status=$status"
              if [ "$status" -ne 0 ]; then
                continue
              fi
              cd "$dir"
              echo "HEAD: $(git rev-parse HEAD 2>&1)"
              matches="$(git ls-tree -r --name-only HEAD | grep -Ei '(^|/)acid\.webp$|animations/.*/effects|animations/effects|username.*effects|/effects/.*\.webp$' | head -n 300)"
              if [ -n "$matches" ]; then
                echo "$matches"
              else
                echo '(no matching paths)'
              fi
            done <<'EOF'
          themotte/rDrama frost
          jewspy/rdrama master
          G-tix96/rdrama master
          TLSM/rDrama frost
          electricwhisk/rdrama frost
          k5josh/rDrama frost
          DinoInNameOnly/rDrama frost
          JamPaladin/rDrama frost
          EOF
          } > "$GITHUB_WORKSPACE/asset-restore-diagnostic.txt" 2>&1
          cd "$GITHUB_WORKSPACE"
          cat asset-restore-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asset-restore-diagnostic.txt
          git commit -m 'Record public effect tree diagnostic' || true
          git push origin HEAD:agent/migrate-effect-assets
