name: Diagnose username effect source

on:
  push:
    branches:
      - agent/migrate-effect-assets

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-effect-assets
          fetch-depth: 0
      - name: Probe static mirrors and archives
        shell: bash
        run: |
          set +e
          {
            echo "UTC: $(date -u +%FT%TZ)"
            while read -r url; do
              echo
              echo "=== $url ==="
              rm -f /tmp/probe.bin
              curl -L --connect-timeout 15 --max-time 60 --user-agent 'Mozilla/5.0 ObsessionAssetDiagnostic/3.0' -o /tmp/probe.bin -w 'status=%{http_code} bytes=%{size_download} type=%{content_type} final=%{url_effective}\n' "$url" 2>&1
              file /tmp/probe.bin 2>&1 || true
              if [ -f /tmp/probe.bin ]; then
                python - <<'PY'
          from pathlib import Path
          data = Path('/tmp/probe.bin').read_bytes()
          print('magic=', data[:16])
          PY
              fi
            done <<'EOF'
          https://i.rdrama.net/assets/i/animations/effects/acid.webp?x=61
          https://staging.rdrama.net/assets/i/animations/effects/acid.webp?x=61
          https://devrama.net/assets/i/animations/effects/acid.webp?x=61
          https://redscarepod.net/assets/i/animations/effects/acid.webp?x=61
          https://www.themotte.org/assets/i/animations/effects/acid.webp
          https://watchpeopledie.tv/assets/i/animations/effects/acid.webp
          https://web.archive.org/web/2id_/https://rdrama.net/assets/i/animations/effects/acid.webp
          https://web.archive.org/cdx/search/cdx?url=rdrama.net/assets/i/animations/effects/acid.webp&output=json&filter=statuscode:200&fl=timestamp,original,statuscode,mimetype,digest,length&limit=10
          EOF
          } > "$GITHUB_WORKSPACE/asset-restore-diagnostic.txt" 2>&1
          cd "$GITHUB_WORKSPACE"
          cat asset-restore-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asset-restore-diagnostic.txt
          git commit -m 'Record effect mirror diagnostic' || true
          git push origin HEAD:agent/migrate-effect-assets
