name: Diagnose username effect source

on:
  push:
    branches:
      - agent/migrate-effect-assets

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-effect-assets
          fetch-depth: 0
      - name: Probe upstream repository tree
        shell: bash
        run: |
          set +e
          rm -rf /tmp/rdrama-upstream
          {
            echo "UTC: $(date -u +%FT%TZ)"
            echo "CLONE:"
            git clone --depth 1 --filter=blob:none --no-checkout --branch frost https://github.com/themotte/rDrama.git /tmp/rdrama-upstream 2>&1
            echo "clone_status=$?"
            echo
            if [ -d /tmp/rdrama-upstream/.git ]; then
              cd /tmp/rdrama-upstream
              echo "HEAD: $(git rev-parse HEAD 2>&1)"
              echo "ACID PATHS:"
              git ls-tree -r --name-only HEAD | grep -Ei '(^|/)acid\.webp$' | head -n 50
              echo
              echo "EFFECT-LIKE DIRECTORIES:"
              git ls-tree -r --name-only HEAD | grep -Ei 'animations/.*/effects|animations/effects|username.*effects|/effects/.*\.webp$' | head -n 300
            fi
          } > "$GITHUB_WORKSPACE/asset-restore-diagnostic.txt" 2>&1
          cd "$GITHUB_WORKSPACE"
          cat asset-restore-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asset-restore-diagnostic.txt
          git commit -m 'Record upstream effect tree diagnostic' || true
          git push origin HEAD:agent/migrate-effect-assets
