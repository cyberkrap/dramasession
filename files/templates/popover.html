<style nonce="{{g.nonce}}">
	/* Ban-hat artwork is taller than the avatar. Center the full artwork over
	   the profile picture without changing ordinary cosmetic hat placement. */
	body .popover-user-profile .popover-profile-identity img.profile-pic-75-hat[src*="/ban-hats/"] {
		top: 50% !important;
		left: 50% !important;
		bottom: auto !important;
		width: 75px !important;
		height: auto !important;
		max-width: none !important;
		max-height: none !important;
		object-fit: contain !important;
		object-position: center !important;
		transform: translate(-50%, -50%) !important;
	}
</style>
<div style="display:none" id="popover">
	<div class="popover-user-profile">
		<img loading="lazy" class="pop-banner w-100 h-64 object-cover">
		<div class="d-flex align-items-end px-3 mt-n6 mb-3 popover-profile-identity">
			<div class="profile-pic-75-wrapper">
				<img loading="lazy" class="pop-picture profile-pic-75">
				<img class="pop-hat profile-pic-75-hat hat" loading="lazy">
			</div>
			<div class="px-3 text-truncate">
			<h5 class="pop-username text-truncate text-black mb-1 pb-1"></h5>
			<span class="text-black">Joined <span class="pop-created-date"></span></span>
			<div class="popover-profile-meta text-black">
				<span>ID <strong class="pop-user-id"></strong></span>
				<span>Truescore <strong class="pop-truescore"></strong></span>
			</div>
			</div>
		</div>

		{% if FEATURES['USERS_PROFILE_BODYTEXT'] -%}
			<div class="px-3 popover-bio-div y-scroll">
				<span class="pop-bio popover-bio text-black"></span>
			</div>
		{%- endif %}

		{% if FEATURES['BADGES'] -%}
			<div class="popover-badges-div y-scroll">
				<div class="pop-badges ml-3 mr-3 my-2">
				</div>
			</div>
		{%- endif %}

	<div class="border-top d-flex align-items-center p-3 gap-3 smol popover-profile-stats">
		<a class="pop-post-link pop-profile-stat text-black" href="/">
			<strong class="pop-postcount"></strong><span>posts</span>
		</a>
		<a class="pop-comment-link pop-profile-stat text-black" href="/">
			<strong class="pop-commentcount"></strong><span>comments</span>
		</a>
		<span class="pop-profile-stat">
			<strong class="pop-coins"></strong><span>Wishcoins</span>
		</span>
		<span class="pop-profile-stat">
			<strong class="pop-bux"></strong><span>Wishbux</span>
		</span>
		<a href="/" {% if v and v.newtab %}data-target="t" target="_blank"{% endif %} class="pop-view_more ml-auto text-decoration-none">
		<span class="ml-3">View</span>
		<i class="fas fa-arrow-right fa-sm px-1"></i>
		</a>
	</div>
	</div>
</div>
