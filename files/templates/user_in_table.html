{%- include 'admin/shadowbanned_tooltip.html' -%}
{% if user %}
<a class="user-name" data-sort-key="{{user.username.lower()}}" style="color:#{{user.name_color}};font-weight:bold;display:inline-flex;align-items:center;gap:.45rem;vertical-align:middle;white-space:nowrap" href="/@{{user.username}}">
	<div class="profile-pic-20-wrapper mb-0" style="flex:0 0 auto">
		<img loading="lazy" src="{{user.profile_url}}" class="pp20">
		{% if user.hat_active(v)[0] -%}
			<img class="profile-pic-20-hat hat" loading="lazy" src="{{user.hat_active(v)[0]}}?h=7" data-bs-toggle="tooltip" data-bs-placement="bottom" title="{{user.hat_active(v)[1]}}">
		{%- endif %}
	</div>
	<span data-username-effect-user="{{user.id}}" data-username-effects="{{user.active_username_effects|join(',')}}" data-username-effect-color="{{user.username_effect_text_color}}" {% if user.active_patron %}class="patron" style="background-color:#{{user.name_color}}"{% endif %}>{{user.user_name}}</span>
</a>
{% endif %}
